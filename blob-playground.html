<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Red Glow Playground</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        background: #0b0b0c;
        color: #fff;
        font-family: 'DM Sans', system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4rem 2rem;
      }

      /* ─────────────────────────────────────────────
         DEMO CARD — solo para mostrar el glow detrás de
         una imagen. No es parte del componente.
         ───────────────────────────────────────────── */
      .demo-card {
        position: relative;
        width: 480px;
        aspect-ratio: 4 / 3;
        border-radius: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        /* el stage se desborda: dejamos que el glow salga de la card */
        overflow: visible;
      }

      .demo-card__image {
        position: relative;
        z-index: 2;
        width: 70%;
        aspect-ratio: 1;
        border-radius: 1rem;
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
      }

      .demo-card__image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* ─────────────────────────────────────────────
         RED GLOW STAGE  (tu código, parametrizado)

         La ÚNICA palanca de tamaño es --glow-scale en
         .red-glow-stage. Como las animaciones usan
         translate(%) (relativo al propio blob) + rotate
         + scale (independientes del tamaño), el MOVIMIENTO
         se mantiene idéntico — solo cambia la escala.
         ───────────────────────────────────────────── */
      .red-glow-stage {
        --glow-scale: 1; /* ← cambiá esto para escalar todo */
        --glow-speed: 1; /* solo playground: 1 = velocidad real, mayor = más rápido */

        position: absolute;
        inset: 0;
        overflow: visible;
        pointer-events: none;
        z-index: 0;
        border-radius: inherit;
      }

      .rg-blob {
        position: absolute;
        top: 50%;
        left: 50%;
        width: calc(43.75rem * var(--glow-scale));
        height: calc(23.75rem * var(--glow-scale));
        background: radial-gradient(
          ellipse 50% 75% at 50% 50%,
          #e10600 0%,
          rgba(225, 6, 0, 0.4) 35%,
          rgba(225, 6, 0, 0) 75%
        );
        filter: blur(calc(40px * var(--glow-scale)));
        will-change: transform;
      }

      .rg-blob-1 {
        opacity: 0.48;
        animation: rg-flow-1 calc(32s / var(--glow-speed))
          cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }

      .rg-blob-2 {
        width: calc(33.75rem * var(--glow-scale));
        height: calc(26.25rem * var(--glow-scale));
        background: radial-gradient(
          ellipse 70% 50% at 50% 50%,
          #e10600 0%,
          rgba(225, 6, 0, 0.4) 35%,
          rgba(225, 6, 0, 0) 75%
        );
        opacity: 0.33;
        animation: rg-flow-2 calc(42s / var(--glow-speed))
          cubic-bezier(0.5, 0.05, 0.5, 0.95) infinite;
        animation-delay: -14s;
      }

      .rg-blob-3 {
        width: calc(51.25rem * var(--glow-scale));
        height: calc(16.25rem * var(--glow-scale));
        background: radial-gradient(
          ellipse 55% 65% at 50% 50%,
          #e10600 0%,
          rgba(225, 6, 0, 0.35) 35%,
          rgba(225, 6, 0, 0) 75%
        );
        opacity: 0.21;
        animation: rg-flow-3 calc(54s / var(--glow-speed))
          cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        animation-delay: -24s;
      }

      @keyframes rg-flow-1 {
        0% {
          transform: translate(-55%, -52%) rotate(-6deg) scale(1, 1);
        }
        20% {
          transform: translate(-38%, -60%) rotate(7deg) scale(1.12, 0.93);
        }
        40% {
          transform: translate(-32%, -44%) rotate(-2deg) scale(0.94, 1.08);
        }
        60% {
          transform: translate(-50%, -36%) rotate(9deg) scale(1.06, 0.92);
        }
        80% {
          transform: translate(-66%, -50%) rotate(-8deg) scale(0.98, 1.04);
        }
        100% {
          transform: translate(-55%, -52%) rotate(-6deg) scale(1, 1);
        }
      }
      @keyframes rg-flow-2 {
        0% {
          transform: translate(-48%, -48%) rotate(5deg) scale(1.05, 0.97);
        }
        25% {
          transform: translate(-62%, -42%) rotate(-9deg) scale(0.92, 1.08);
        }
        50% {
          transform: translate(-56%, -60%) rotate(4deg) scale(1.1, 0.95);
        }
        75% {
          transform: translate(-40%, -54%) rotate(-3deg) scale(0.95, 1.05);
        }
        100% {
          transform: translate(-48%, -48%) rotate(5deg) scale(1.05, 0.97);
        }
      }
      @keyframes rg-flow-3 {
        0% {
          transform: translate(-52%, -50%) rotate(-3deg) scale(0.95, 1);
        }
        20% {
          transform: translate(-44%, -58%) rotate(6deg) scale(1.1, 0.9);
        }
        40% {
          transform: translate(-58%, -46%) rotate(-7deg) scale(0.92, 1.08);
        }
        60% {
          transform: translate(-46%, -40%) rotate(2deg) scale(1.08, 0.94);
        }
        80% {
          transform: translate(-60%, -56%) rotate(-5deg) scale(0.98, 1.02);
        }
        100% {
          transform: translate(-52%, -50%) rotate(-3deg) scale(0.95, 1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .rg-blob {
          animation: none;
        }
      }

      /* ─────────────────────────────────────────────
         Controles del playground (no van a producción)
         ───────────────────────────────────────────── */
      .controls {
        position: fixed;
        top: 1.5rem;
        left: 1.5rem;
        background: rgba(20, 20, 22, 0.85);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 0.75rem;
        padding: 1.25rem 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        font-size: 0.85rem;
        z-index: 10;
        min-width: 240px;
      }

      .controls label {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        color: #b8b8bd;
      }

      .controls input[type='range'] {
        width: 100%;
        accent-color: #e10600;
      }

      .controls .value {
        color: #fff;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <label>
        Escala del glow <span class="value" id="scaleVal">1.00×</span>
        <input
          type="range"
          id="scale"
          min="0.3"
          max="2.5"
          value="1"
          step="0.05"
        />
      </label>
      <label>
        Velocidad (solo demo) <span class="value" id="speedVal">1.0×</span>
        <input type="range" id="speed" min="1" max="15" value="1" step="0.5" />
      </label>
    </div>

    <div class="demo-card">
      <div class="red-glow-stage" id="stage" aria-hidden="true">
        <div class="rg-blob rg-blob-1"></div>
        <div class="rg-blob rg-blob-2"></div>
        <div class="rg-blob rg-blob-3"></div>
      </div>
      <div class="demo-card__image">
        <img
          src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=600&q=80"
          alt="demo"
        />
      </div>
    </div>

    <script>
      const stage = document.getElementById('stage')
      const scale = document.getElementById('scale')
      const scaleVal = document.getElementById('scaleVal')

      scale.addEventListener('input', () => {
        stage.style.setProperty('--glow-scale', scale.value)
        scaleVal.textContent = parseFloat(scale.value).toFixed(2) + '×'
      })

      const speed = document.getElementById('speed')
      const speedVal = document.getElementById('speedVal')
      speed.addEventListener('input', () => {
        stage.style.setProperty('--glow-speed', speed.value)
        speedVal.textContent = parseFloat(speed.value).toFixed(1) + '×'
      })
    </script>
  </body>
</html>
